<!-- =====================================================
     CONTACT PAGE
===================================================== -->

<main class="contact-page">


    <div class="contact-wrapper">


        <!-- HEADING -->

        <div class="contact-heading">


            <div class="section-label">
                CONTACT
            </div>


            <h1>
                Let's Connect
            </h1>


            <p>
                Have an idea, challenge or opportunity?
            </p>

        </div>



        <!-- =================================================
             CONTACT FORM
        ================================================= -->

        <form class="contact-form"
              action="https://formsubmit.co/poudel.achut@gmail.com"
              method="POST">


            <!-- FormSubmit settings -->

            <input type="hidden"
                   name="_subject"
                   value="New Contact Message - Achut Poudel Website">


            <input type="hidden"
                   name="_captcha"
                   value="false">


            <input type="hidden"
                   name="_template"
                   value="table">


            <!-- Return visitor to homepage -->

            <input type="hidden"
                   name="_next"
                   value="https://achutpoudel.com.np/">



            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>


                <input type="text"
                       id="fullName"
                       name="Full Name"
                       placeholder="Your full name"
                       required>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>


                <input type="email"
                       id="email"
                       name="Email"
                       placeholder="Your email address"
                       required>

            </div>



            <!-- HOW CAN I HELP -->

            <div class="form-group">

                <label for="help">
                    How Can I Help?
                </label>


                <select id="help"
                        name="How Can I Help?"
                        required>


                    <option value=""
                            disabled
                            selected>

                        Select an option

                    </option>


                    <option>
                        Business / Executive / Leadership Consultation
                    </option>


                    <option>
                        AI &amp; Digital Transformation
                    </option>


                    <option>
                        HR &amp; People Strategy
                    </option>


                    <option>
                        Legal &amp; Compliance
                    </option>


                    <option>
                        Marketing / Know Your Product
                    </option>


                    <option>
                        Grow Your Product / Sales
                    </option>


                    <option>
                        Speaking / Training
                    </option>


                    <option>
                        Other
                    </option>


                </select>

            </div>



            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    Message
                </label>


                <textarea id="message"
                          name="Message"
                          rows="6"
                          placeholder="Your message"
                          required></textarea>

            </div>



            <!-- SEND -->

            <button type="submit"
                    class="contact-submit">

                SEND MESSAGE

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        </form>



        <!-- SOCIAL LINKS -->

        <div class="contact-social">


            <span>
                Or connect with me
            </span>


            <div class="contact-social-links">


                <a href="https://www.linkedin.com/in/achutpdl/"
                   target="_blank"

                   aria-label="LinkedIn">

                    <i class="fa-brands fa-linkedin-in"></i>

                <a href="https://www.facebook.com/acyuta.paaidela/"
