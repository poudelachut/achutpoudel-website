<!-- =====================================================
     CONTACT
===================================================== -->

<main class="contact-page">


    <div class="contact-wrapper">


        <!-- HEADING -->

        <div class="contact-heading">


            <div class="section-label">
                CONTACT
            </div>


            <h1>
                Let's Connect
            </h1>


            <p>
                Have an idea, challenge or opportunity?
            </p>

        </div>



        <!-- FORM -->

        <form class="contact-form"
              action="#"
              method="POST">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>


                <input type="text"
                       id="fullName"
                       name="fullName"
                       placeholder="Your full name"
                       autocomplete="name"
                       required>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>


                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Your email address"
                       autocomplete="email"
                       required>

            </div>



            <!-- HOW CAN I HELP -->

            <div class="form-group">

                <label for="help">
                    How Can I Help?
                </label>


                <select id="help"
                        name="help"
                        required>


                    <option value=""
                            disabled
                            selected>

                        Select an option

                    </option>


                    <option value="business-executive-leadership">

                        Business / Executive / Leadership Consultation

                    </option>


                    <option value="ai-digital-transformation">

                        AI &amp; Digital Transformation

                    </option>


                    <option value="hr-people-strategy">

                        HR &amp; People Strategy

                    </option>


                    <option value="legal-compliance">

                        Legal &amp; Compliance

                    </option>


                    <option value="marketing-product">

                        Marketing / Know Your Product

                    </option>


                    <option value="product-sales">

                        Grow Your Product / Sales

                    </option>


                    <option value="speaking-training">

                        Speaking / Training

                    </option>


                    <option value="other">

                        Other

                    </option>


                </select>

            </div>



            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    Message
                </label>


                <textarea id="message"
                          name="message"
                          rows="6"
                          placeholder="Your message"
                          required></textarea>

            </div>



            <!-- SEND -->

            <button type="submit"
                    class="contact-submit">

                SEND MESSAGE

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        </form>



        <!-- SOCIAL -->

        <div class="contact-social">


            <span>
                Or connect with me
            </span>


            <div class="contact-social-links">


                <a href="https://www.linkedin.com/in/achutpdl/"
                   target="_blank"
                   rel="noopener noreferrer"

<script>

    mobileMenu.classList.toggle("active");
