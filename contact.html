<!-- CONTACT SECTION -->
<section class="contact-section">

    <div class="contact-container">

        <!-- LEFT SIDE: CONTACT BOX -->
        <div class="contact-box">

            <p class="contact-label">GET IN TOUCH</p>

            <h1>Let's Connect</h1>

            <p class="contact-intro">
                Let's connect and create meaningful impact.
            </p>

            <form class="contact-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Your email address">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Subject">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Your message"></textarea>
                </div>

                <button type="submit" class="contact-button">
                    SEND MESSAGE
                </button>

            </form>

        </div>


        <!-- RIGHT SIDE: EXISTING PHOTO -->
        <div class="contact-image">

            <!-- KEEP YOUR EXISTING PHOTO PATH HERE -->
            <img src="images/achut-poudel.jpg" alt="Achut Poudel">

        </div>

    </div>


    <!-- CONTACT DETAILS BELOW -->
    <div class="contact-details-row">

        <a href="mailto:poudel.achut@gmail.com" class="contact-detail">
            <i class="fas fa-envelope"></i>
            <span>poudel.achut@gmail.com</span>
        </a>

        <a href="tel:+9779841151881" class="contact-detail">
            <i class="fas fa-phone"></i>
            <span>+977-9841151881</span>
        </a>

        <div class="contact-detail">
            <i class="fas fa-location-dot"></i>
            <span>Kathmandu, Nepal</span>
        </div>

    </div>

</section>
